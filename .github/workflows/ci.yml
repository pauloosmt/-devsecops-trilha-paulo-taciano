name: CI - Build, SAST, SCA, Container e Secrets

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --severity ERROR --error app/

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - dependências (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Build da imagem
        run: docker build -t task-api:${{ github.sha }} app/

      - name: Trivy - imagem Docker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}